name: CI
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  source-quality:
    timeout-minutes: 25
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version:
        - '3.11'
        - '3.12'
        - '3.13'
        - '3.14'
    defaults:
      run:
        working-directory: workspace/ZPL-II-Printer-Emulator
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: workspace/ZPL-II-Printer-Emulator
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: ${{ matrix.version }}
    - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      with:
        version: 0.12.13
    - name: Install exact lock and test
      env:
        UV_PYTHON: ${{ matrix.version }}
        UV_PYTHON_DOWNLOADS: never
      run: |
        uv lock --check
        uv sync --locked --extra dev
        uv run --locked python -m compileall -q zpl_printer_emulator
        uv run --locked pytest -q --junitxml=artifacts/pytest.xml
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: test-reports-${{ matrix.version }}
        path: workspace/ZPL-II-Printer-Emulator/artifacts/
        retention-days: 14
  source-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567
      with:
        version: v0.74.0
        cache: true
    - name: Scan locked dependencies, configuration and secrets
      run: |
        mkdir -p artifacts
        python3 scripts/security_gate.py --self-test
        python3 scripts/test_release.py
        trivy fs --scanners vuln,misconfig,secret --include-dev-deps --skip-dirs .git,.venv,node_modules,target,artifacts --skip-files '**/*.dockerignore' --format json --output "$RUNNER_TEMP/source-scan.json" .
        python3 scripts/security_gate.py "$RUNNER_TEMP/source-scan.json"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: source-security-report
        path: artifacts/source-scan.json
        retention-days: 14
  container:
    uses: ./.github/workflows/container-gate.yml
  quality-and-container-gate:
    if: always()
    needs:
    - source-quality
    - source-security
    - container
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - name: Require every quality gate
      env:
        RESULTS: ${{ toJSON(needs) }}
      run: |
        python3 -c 'import json,os; assert all(j["result"] == "success" for j in json.loads(os.environ["RESULTS"]).values())'
  maintenance-gate:
    name: ci-gate
    if: always()
    needs:
    - source-quality
    - source-security
    - container
    - quality-and-container-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - name: Require every check
      env:
        RESULTS: ${{ toJSON(needs) }}
      run: |
        python3 - <<'PY'
        import json, os
        results = json.loads(os.environ['RESULTS'])
        failed = {name: value['result'] for name, value in results.items() if value['result'] not in ('success',)}
        if failed:
            raise SystemExit(str(failed))
        PY
'on':
  pull_request:
    branches:
    - main
  workflow_call: null
  workflow_dispatch: null
